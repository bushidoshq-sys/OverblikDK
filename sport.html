<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />

  <title>OverblikDK – Sport</title>
  <link rel="stylesheet" href="assets/styles.css?v=22" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <script>
    (function () {
      const savedTheme = localStorage.getItem('overblikdk-theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
<header class="header">
  <div class="brand container">
    <img class="logo" src="icons/logo.png" alt="">
    <div>
      <h1>OverblikDK</h1>
      <small>Sport</small>
    </div>
  
      <a class="header-icon-btn" href="/" aria-label="Forside" title="Forside">🏛️</a>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Skift mellem lys og mørk visning" aria-pressed="false">
        <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
        <span class="theme-toggle__text">Mørk</span>
      </button></div>
  <div class="navline"></div>
</header>

<main class="container">
  <p><a class="back" href="index.html">← Tilbage til forsiden</a></p>

  <div class="toolbar">
    <div class="input" role="search">🔎
      <input id="filter" type="search" placeholder="Søg i sport, forbund eller klub" aria-label="Søg i links">
    </div>
    <span class="badge"><strong id="count">0</strong> links</span>
  </div>

  <div class="category-buttons" id="sportCategories" aria-label="Sportskategorier">
    <button class="category-btn active" data-category="Alle">Alle</button>
    <button class="category-btn" data-category="Organisationer">Organisationer</button>
    <button class="category-btn" data-category="Fodbold">Fodbold</button>
    <button class="category-btn" data-category="Håndbold">Håndbold</button>
    <button class="category-btn" data-category="Badminton">Badminton</button>
    <button class="category-btn" data-category="Basketball">Basketball</button>
    <button class="category-btn" data-category="Ishockey">Ishockey</button>
    <button class="category-btn" data-category="Svømning">Svømning</button>
    <button class="category-btn" data-category="Atletik">Atletik</button>
    <button class="category-btn" data-category="Cykling">Cykling</button>
    <button class="category-btn" data-category="Tennis">Tennis</button>
    <button class="category-btn" data-category="Gymnastik">Gymnastik</button>
    <button class="category-btn" data-category="Golf">Golf</button>
    <button class="category-btn" data-category="Ridning">Ridning</button>
    <button class="category-btn" data-category="Sejlads & roning">Sejlads & roning</button>
    <button class="category-btn" data-category="Kampsport">Kampsport</button>
    <button class="category-btn" data-category="Volleyball">Volleyball</button>
    <button class="category-btn" data-category="Bordtennis">Bordtennis</button>
    <button class="category-btn" data-category="Motorsport">Motorsport</button>
    <button class="category-btn" data-category="Andre sportsgrene">Andre sportsgrene</button>
  </div>
  <h2 id="sportHeading">Alle sportslinks</h2>
  <ul id="links" class="link-list" aria-label="Sportslinks"></ul>
</main>

<footer class="container">© <span id="year"></span> OverblikDK · BushidoDK</footer>

<script>
  function sortDa(a,k){return a.slice().sort((x,y)=>x[k].localeCompare(y[k],'da',{sensitivity:'base'}))}
  function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch{return''}}
  function render(el,data){
    el.innerHTML=''; const s=sortDa(data,'name');
    s.forEach(({name,url})=>{
      const li = document.createElement('li');
      li.innerHTML = `<a href="${url}" target="_blank" rel="noopener"><span>${name}</span><span class="host">${host(url)}</span></a>`;
      el.appendChild(li);
    });
    return s.length;
  }
  function wireFilter(inp, lists){
    inp.addEventListener('input',()=>{
      const q = inp.value.toLowerCase().trim();
      lists.forEach(ul => {
        for (const li of ul.querySelectorAll('li')) {
          li.style.display = li.textContent.toLowerCase().includes(q) ? '' : 'none';
        }
      });
    });
  }

  const SPORTS = [

    {name:'Viborg FF',url:'https://vff.dk',category:'Fodbold'},
    {name:'Metal Ligaen',url:'https://metalligaen.dk',category:'Ishockey'},

    {name:'Rungsted Seier Capital',url:'https://rungsted.is',category:'Ishockey'},

    {name:'Basketligaen',url:'https://www.basketligaen.dk',category:'Basketball'},
    {name:'Volleyligaen',url:'https://volleyball.dk',category:'Volleyball'},
  ];
  let activeCategory='Alle';
  const list=document.getElementById('links');
  const filter=document.getElementById('filter');
  function refresh(){
    const q=filter.value.toLowerCase().trim();
    const data=SPORTS.filter(x=>(activeCategory==='Alle'||x.category===activeCategory)&&(!q||(x.name+' '+x.category).toLowerCase().includes(q)));
    render(list,data); document.getElementById('count').textContent=data.length;
    document.getElementById('sportHeading').textContent=activeCategory==='Alle'?'Alle sportslinks':activeCategory;
  }
  filter.addEventListener('input',refresh);
  document.querySelectorAll('#sportCategories .category-btn').forEach(btn=>btn.addEventListener('click',()=>{
    activeCategory=btn.dataset.category;
    document.querySelectorAll('#sportCategories .category-btn').forEach(b=>b.classList.toggle('active',b===btn));
    refresh();
  }));
  refresh();
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</html>
