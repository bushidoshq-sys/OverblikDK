<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OverblikDK – Medier (TV, radio & aviser)</title>
  <link rel="stylesheet" href="assets/styles.css?v=62" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <script>
    (function () {
      const savedTheme = localStorage.getItem('overblikdk-theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
<header class="header">
  <div class="brand container">
    <img class="logo" src="icons/logo.png" alt="">
    <div>
      <h1>OverblikDK</h1>
      <small>Medier – TV, radio & aviser</small>
    </div>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Skift mellem lys og mørk visning" aria-pressed="false">
        <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
        <span class="theme-toggle__text">Mørk</span>
      </button>
      <a class="header-icon-btn" href="indstillinger.html" aria-label="Indstillinger" title="Indstillinger">⚙️</a></div>
  <div class="navline"></div>
</header>

<main class="container">
  <p><a class="back" href="index.html">← Tilbage</a></p>

  <div class="toolbar">
    <div class="input" role="search">
      🔎 <input id="filter" type="search" placeholder="Søg i medier…" aria-label="Søg i links">
    </div>
    <span class="badge"><strong id="count">0</strong> links</span>
  </div>
  <div class="category-filter" id="categoryFilter" aria-label="Filtrér medier">
    <button class="category-btn active" data-category="Alle">Alle</button>
    <button class="category-btn" data-category="TV & public service">TV & public service</button>
    <button class="category-btn" data-category="Radio">Radio</button>
    <button class="category-btn" data-category="Landsdækkende aviser">Landsdækkende aviser</button>
    <button class="category-btn" data-category="Erhverv & politik">Erhverv & politik</button>
    <button class="category-btn" data-category="Regionale & lokale medier">Regionale & lokale medier</button>
    <button class="category-btn" data-category="Digitale medier">Digitale medier</button>
    <button class="category-btn" data-category="Magasiner & ugeblade">Magasiner & ugeblade</button>
  </div>

  <ul id="links" class="link-list" aria-label="Medier"></ul>
</main>

<footer class="container">© <span id="year"></span> OverblikDK · BushidoDK</footer>

<script>
  function sortDa(arr, key){ return arr.slice().sort((a,b)=> a[key].localeCompare(b[key],'da',{sensitivity:'base'})); }
  function host(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return '' } }
  function render(listEl, data){
    listEl.innerHTML = '';
    const sorted = sortDa(data,'name');
    sorted.forEach(({name,url,category})=>{
      const li = document.createElement('li');
      li.innerHTML = `<a href="${url}" target="_blank" rel="noopener">
        <span>${name}</span><span class="host">${host(url)} · ${category}</span></a>`;
      listEl.appendChild(li);
    });
    document.getElementById('count').textContent = String(sorted.length);
  }
  function wireFilter(inputEl, listEl){
    inputEl.addEventListener('input', ()=>{
      const q = inputEl.value.toLowerCase().trim();
      for(const li of listEl.querySelectorAll('li')){
        li.style.display = li.textContent.toLowerCase().includes(q) ? '' : 'none';
      }
    });
  }

  const LINKS = [
    {name:'DR',url:'https://www.dr.dk',category:'TV & public service'},
    {name:'TV 2',url:'https://tv2.dk',category:'TV & public service'},
    {name:'DRTV',url:'https://www.dr.dk/drtv/',category:'TV & public service'},
    {name:'DR Lyd',url:'https://www.dr.dk/lyd',category:'Radio'},
    {name:'B.T.',url:'https://www.bt.dk',category:'Landsdækkende aviser'},
    {name:'Berlingske',url:'https://www.berlingske.dk',category:'Landsdækkende aviser'},
    {name:'Ekstra Bladet',url:'https://ekstrabladet.dk',category:'Landsdækkende aviser'},
    {name:'Information',url:'https://www.information.dk',category:'Landsdækkende aviser'},
    {name:'Jyllands-Posten',url:'https://www.jp.dk',category:'Landsdækkende aviser'},
    {name:'Kristeligt Dagblad',url:'https://www.kristeligt-dagblad.dk',category:'Landsdækkende aviser'},
    {name:'Politiken',url:'https://politiken.dk',category:'Landsdækkende aviser'},
    {name:'Weekendavisen',url:'https://www.weekendavisen.dk',category:'Landsdækkende aviser'},
    {name:'Altinget',url:'https://www.altinget.dk',category:'Erhverv & politik'},
    {name:'Børsen',url:'https://borsen.dk',category:'Erhverv & politik'},
    {name:'Finans',url:'https://finans.dk',category:'Erhverv & politik'},
    {name:'Zetland',url:'https://www.zetland.dk',category:'Digitale medier'},
    {name:'SE og HØR',url:'https://www.seoghoer.dk',category:'Magasiner & ugeblade'},

    {name:'TV 2 ØST',url:'https://www.tv2east.dk',category:'Regionale & lokale medier'},
    {name:'TV 2 Fyn',url:'https://www.tv2fyn.dk',category:'Regionale & lokale medier'},
    {name:'TV SYD',url:'https://www.tvsyd.dk',category:'Regionale & lokale medier'},
    {name:'TV MIDTVEST',url:'https://www.tvmidtvest.dk',category:'Regionale & lokale medier'},
    {name:'TV2 Østjylland',url:'https://www.tv2ostjylland.dk',category:'Regionale & lokale medier'},
    {name:'TV2 Nord',url:'https://www.tv2nord.dk',category:'Regionale & lokale medier'},
    {name:'TV 2 Bornholm',url:'https://www.tv2bornholm.dk',category:'Regionale & lokale medier'},
    {name:'Sjællandske Nyheder',url:'https://www.sn.dk',category:'Regionale & lokale medier'},
    {name:'Fyens Stiftstidende',url:'https://fyens.dk',category:'Regionale & lokale medier'},
    {name:'JydskeVestkysten',url:'https://jv.dk',category:'Regionale & lokale medier'},
    {name:'Vejle Amts Folkeblad',url:'https://vafo.dk',category:'Regionale & lokale medier'},
    {name:'Horsens Folkeblad',url:'https://hsfo.dk',category:'Regionale & lokale medier'},
    {name:'Århus Stiftstidende',url:'https://stiften.dk',category:'Regionale & lokale medier'},
    {name:'Herning Folkeblad',url:'https://www.herningfolkeblad.dk',category:'Regionale & lokale medier'},
    {name:'Nordjyske',url:'https://nordjyske.dk',category:'Regionale & lokale medier'},
    {name:'Bornholms Tidende',url:'https://tidende.dk',category:'Regionale & lokale medier'},
    {name:'Radio IIII',url:'https://radio4.dk',category:'Radio'},
    {name:'NOVA',url:'https://radioplay.dk/nova',category:'Radio'},
    {name:'Radio 100',url:'https://radioplay.dk/radio100',category:'Radio'},
    {name:'Pop FM',url:'https://radioplay.dk/popfm',category:'Radio'},
    {name:'The Voice',url:'https://radioplay.dk/thevoice',category:'Radio'},
    {name:'Fyns Amts Avis',url:'https://faa.dk',category:'Regionale & lokale medier'},
    {name:'Fredericia Dagblad',url:'https://frdb.dk',category:'Regionale & lokale medier'},
    {name:'Randers Amtsavis',url:'https://amtsavisen.dk',category:'Regionale & lokale medier'},
    {name:'Viborg Stifts Folkeblad',url:'https://viborg-folkeblad.dk',category:'Regionale & lokale medier'},
    {name:'Dagbladet Holstebro-Struer',url:'https://dagbladet-holstebro-struer.dk',category:'Regionale & lokale medier'},
    {name:'Dagbladet Ringkøbing-Skjern',url:'https://dbrs.dk',category:'Regionale & lokale medier'},
    {name:'Lemvig Folkeblad',url:'https://folkebladetlemvig.dk',category:'Regionale & lokale medier'},
    {name:'Midtjyllands Avis',url:'https://www.midtjyllandsavis.dk',category:'Regionale & lokale medier'},
    {name:'Skive Folkeblad',url:'https://www.skivefolkeblad.dk',category:'Regionale & lokale medier'},
    {name:'Lolland-Falsters Folketidende',url:'https://folketidende.dk',category:'Regionale & lokale medier'},
    {name:'Flensborg Avis',url:'https://www.fla.de',category:'Regionale & lokale medier'},
    {name:'Der Nordschleswiger',url:'https://www.nordschleswiger.dk',category:'Regionale & lokale medier'},
    {name:'The Copenhagen Post',url:'https://cphpost.dk',category:'Regionale & lokale medier'},
    {name:'POV International',url:'https://pov.international',category:'Digitale medier'},
    {name:'Netavisen Pio',url:'https://piopio.dk',category:'Digitale medier'},
    {name:'Mandag Morgen',url:'https://www.mm.dk',category:'Digitale medier'},
    {name:'BILLED-BLADET',url:'https://www.billedbladet.dk',category:'Magasiner & ugeblade'},
    {name:'Femina',url:'https://www.femina.dk',category:'Magasiner & ugeblade'},
    {name:'Familie Journal',url:'https://www.familiejournal.dk',category:'Magasiner & ugeblade'},
    {name:'Hjemmet',url:'https://www.hjemmet.dk',category:'Magasiner & ugeblade'},
    {name:'Alt for damerne',url:'https://www.alt.dk',category:'Magasiner & ugeblade'},
    {name:'Euroman',url:'https://www.euroman.dk',category:'Magasiner & ugeblade'},
    {name:'Illustreret Videnskab',url:'https://illvid.dk',category:'Magasiner & ugeblade'}
  ];

  const listEl = document.getElementById('links');
  const filterEl = document.getElementById('filter');
  let activeCategory='Alle';
  function applyFilters(){
    const q=filterEl.value.toLowerCase().trim();
    render(listEl,LINKS.filter(x=>(activeCategory==='Alle'||x.category===activeCategory)&&(!q||(x.name+' '+x.category+' '+host(x.url)).toLowerCase().includes(q))));
  }
  filterEl.addEventListener('input',applyFilters);
  document.querySelectorAll('.category-btn').forEach(btn=>btn.addEventListener('click',()=>{
    document.querySelectorAll('.category-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); activeCategory=btn.dataset.category; applyFilters();
  }));
  applyFilters();
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

  <script src="assets/theme.js?v=24"></script>
  <script src="assets/favorites.js?v=14"></script>
<script src="assets/pwa-update.js?v=20"></script>
  <script src="assets/native-navigation.js?v=26"></script>
</body>
</html>
