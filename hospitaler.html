<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OverblikDK – Hospitaler</title>
  <link rel="stylesheet" href="assets/styles.css?v=62" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <script>
    (function () {
      const savedTheme = localStorage.getItem('overblikdk-theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
<header class="header">
  <div class="brand container">
    <img class="logo" src="icons/logo.png" alt="">
    <div>
      <h1>OverblikDK</h1>
      <small>Hospitaler</small>
    </div>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Skift mellem lys og mørk visning" aria-pressed="false">
        <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
        <span class="theme-toggle__text">Mørk</span>
      </button>
      <a class="header-icon-btn" href="indstillinger.html" aria-label="Indstillinger" title="Indstillinger">⚙️</a></div>
  <div class="navline"></div>
</header>

<main class="container">
  <p><a class="back" href="index.html">← Tilbage</a></p>

  <section id="hospitalPriority" class="departure-panel" hidden aria-labelledby="hospitalPriorityTitle">
    <div class="departure-head">
      <div>
        <p class="kicker">Dit område</p>
        <h2 id="hospitalPriorityTitle">🏥 Dit primære hospital</h2>
        <ul id="hospitalPriorityLinks" class="link-list"></ul>
      </div>
    </div>
  </section>

  <div class="toolbar">
    <div class="input" role="search">
      🔎 <input id="filter" type="search" placeholder="Søg i hospitaler…" aria-label="Søg i links">
    </div>
    <span class="badge"><strong id="count">0</strong> links</span>
  </div>

  <ul id="links" class="link-list" aria-label="Hospitaler"></ul>
</main>

<footer class="container">© <span id="year"></span> OverblikDK · BushidoDK</footer>

<script src="assets/local-data.js?v=6"></script>
<script src="assets/local-helper.js?v=27"></script>

<script>
  function sortDa(arr, key){ return arr.slice().sort((a,b)=> a[key].localeCompare(b[key],'da',{sensitivity:'base'})); }
  function host(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return '' } }
  function hospitalRank(item) {
    const helper = window.OverblikDKLocalHelper;
    if (!helper?.enabled()) return 0;
    const ctx = helper.context();
    const ownMunicipality = helper.normalizeMunicipality(ctx.kommune);
    const ownRegion = helper.normalizeRegion(helper.canonicalRegionFromContext(ctx));
    const primary = (item.primaryKommuner || []).some(name => helper.normalizeMunicipality(name) === ownMunicipality);
    const sameRegion = helper.normalizeRegion(item.region) === ownRegion;
    if (primary) return 0;
    if (item.regionOverview && sameRegion) return 1;
    if (sameRegion) return 2;
    if (item.national) return 3;
    return 4;
  }

  function sortHospitals(data) {
    if (!window.OverblikDKLocalHelper?.enabled()) return sortDa(data,'name');
    return data.slice().sort((a,b) =>
      hospitalRank(a) - hospitalRank(b) ||
      a.name.localeCompare(b.name,'da',{sensitivity:'base'})
    );
  }

  function renderHospitalPriority(data) {
    const panel = document.getElementById('hospitalPriority');
    const list = document.getElementById('hospitalPriorityLinks');
    if (!panel || !list || !window.OverblikDKLocalHelper?.enabled()) return null;
    const helper = window.OverblikDKLocalHelper;
    const ctx = helper.context();
    const ownMunicipality = helper.normalizeMunicipality(ctx.kommune);
    const explicitPrimary = data.find(item => (item.primaryKommuner || []).some(name => helper.normalizeMunicipality(name) === ownMunicipality));
    const primary = explicitPrimary || data.find(item => hospitalRank(item) === 1);
    if (!primary) return null;
    panel.hidden = false;
    list.innerHTML = `<li><a href="${primary.url}" target="_blank" rel="noopener"><span>${primary.name}</span><span class="host">${host(primary.url)}</span></a></li>`;
    return primary.url;
  }

  function render(listEl, data){
    listEl.innerHTML = '';
    const priorityUrl = renderHospitalPriority(data);
    const sorted = sortHospitals(data);
    sorted.forEach(({name,url})=>{
      if (priorityUrl && url.replace(/\/$/,'') === priorityUrl.replace(/\/$/,'')) return;
      const li = document.createElement('li');
      li.innerHTML = `<a href="${url}" target="_blank" rel="noopener">
        <span>${name}</span><span class="host">${host(url)}</span></a>`;
      listEl.appendChild(li);
    });
    document.getElementById('count').textContent = String(sorted.length);
  }
  function wireFilter(inputEl, listEl){
    inputEl.addEventListener('input', ()=>{
      const q = inputEl.value.toLowerCase().trim();
      for(const li of listEl.querySelectorAll('li')){
        li.style.display = li.textContent.toLowerCase().includes(q) ? '' : 'none';
      }
    });
  }

  const LINKS = [
    {name:'Region Hovedstaden – Hospitaler', url:'https://www.regionh.dk/hospitaler/', region:'Region Hovedstaden', regionOverview:true},
    {name:'Region Midtjylland – Hospitaler', url:'https://www.hospitalsenhedmidt.dk/', region:'Region Midtjylland', regionOverview:true},
    {name:'Region Nordjylland – Hospitaler', url:'https://rn.dk/da/', region:'Region Nordjylland', regionOverview:true},
    {name:'Region Sjælland – Hospitaler', url:'https://www.regionsjaelland.dk/sundhed/sygehuse', region:'Region Sjælland', regionOverview:true},
    {name:'Region Syddanmark – Hospitaler', url:'https://regionsyddanmark.dk/patienter-og-parorende/sygehuse/information-om-sygehuse', region:'Region Syddanmark', regionOverview:true},

    {name:'Aalborg Universitetshospital', url:'https://aalborguh.rn.dk', region:'Region Nordjylland', primaryKommuner:['Aalborg Kommune','Jammerbugt Kommune','Mariagerfjord Kommune','Rebild Kommune','Vesthimmerlands Kommune']},
    {name:'Regionshospital Nordjylland – Hjørring', url:'https://rhnordjylland.rn.dk/hj%C3%B8rring', region:'Region Nordjylland', primaryKommuner:['Brønderslev Kommune','Frederikshavn Kommune','Hjørring Kommune','Læsø Kommune']},
    {name:'Regionshospital Nordjylland – Frederikshavn', url:'https://rhnordjylland.rn.dk/Praktisk-information/Frederikshavn/', region:'Region Nordjylland'},
    {name:'Aarhus Universitetshospital', url:'https://www.auh.dk', region:'Region Midtjylland', primaryKommuner:['Aarhus Kommune','Samsø Kommune']},
    {name:'Amager og Hvidovre Hospital', url:'https://www.hvidovrehospital.dk', region:'Region Hovedstaden', primaryKommuner:['Albertslund Kommune','Brøndby Kommune','Dragør Kommune','Glostrup Kommune','Hvidovre Kommune','Høje-Taastrup Kommune','Ishøj Kommune','Tårnby Kommune','Vallensbæk Kommune']},
    {name:'Bispebjerg og Frederiksberg Hospital', url:'https://www.bispebjerghospital.dk', region:'Region Hovedstaden', primaryKommuner:['Frederiksberg Kommune']},
    {name:'Bornholms Hospital', url:'https://www.bornholmshospital.dk', kommune:'Bornholms Regionskommune', region:'Region Hovedstaden', primaryKommuner:['Bornholms Regionskommune']},
    {name:'Herlev og Gentofte Hospital', url:'https://www.herlevhospital.dk', region:'Region Hovedstaden', primaryKommuner:['Ballerup Kommune','Egedal Kommune','Furesø Kommune','Gentofte Kommune','Gladsaxe Kommune','Herlev Kommune','Lyngby-Taarbæk Kommune','Rudersdal Kommune','Rødovre Kommune']},
    {name:'Nordsjællands Hospital', url:'https://www.nordsjaellandshospital.dk', region:'Region Hovedstaden', primaryKommuner:['Allerød Kommune','Fredensborg Kommune','Frederikssund Kommune','Halsnæs Kommune','Gribskov Kommune','Helsingør Kommune','Hillerød Kommune','Hørsholm Kommune']},
    {name:'Odense Universitetshospital', url:'https://ouh.dk', region:'Region Syddanmark'},
    {name:'Regionshospitalet Gødstrup', url:'https://www.regionshospitalet-goedstrup.dk/', region:'Region Midtjylland', primaryKommuner:['Herning Kommune','Holstebro Kommune','Ringkøbing-Skjern Kommune','Ikast-Brande Kommune','Lemvig Kommune','Struer Kommune']},
    {name:'Regionshospitalet Horsens', url:'https://www.regionshospitalet-horsens.dk/', region:'Region Midtjylland', primaryKommuner:['Horsens Kommune','Hedensted Kommune','Odder Kommune','Skanderborg Kommune']},
    {name:'Regionshospitalet Randers', url:'https://www.regionshospitalet-randers.dk/', region:'Region Midtjylland', primaryKommuner:['Randers Kommune','Norddjurs Kommune','Syddjurs Kommune','Favrskov Kommune']},
    {name:'Regionshospitalet Viborg', url:'https://www.hospitalsenhedmidt.dk/afdelinger-og-steder/regionshospitalet-viborg/', region:'Region Midtjylland', primaryKommuner:['Skive Kommune','Viborg Kommune','Silkeborg Kommune']},
    {name:'Rigshospitalet', url:'https://www.rigshospitalet.dk', region:'Region Hovedstaden', national:true},
    {name:'Esbjerg og Grindsted Sygehus', url:'https://esbjerggrindstedsygehus.dk', region:'Region Syddanmark', primaryKommuner:['Esbjerg Kommune','Fanø Kommune','Varde Kommune','Billund Kommune','Vejen Kommune']},
    {name:'Sygehus Lillebælt', url:'https://www.sygehuslillebaelt.dk', region:'Region Syddanmark', primaryKommuner:['Fredericia Kommune','Kolding Kommune','Middelfart Kommune','Vejle Kommune']},
    {name:'Sygehus Sønderjylland', url:'https://sygehussonderjylland.dk/', region:'Region Syddanmark', primaryKommuner:['Haderslev Kommune','Aabenraa Kommune','Sønderborg Kommune','Tønder Kommune']},
    {name:'Sjællands Universitetshospital', url:'https://www.sjaellandsuniversitetshospital.dk', region:'Region Sjælland'},
    {name:'Holbæk Sygehus', url:'https://www.holbaeksygehus.dk', region:'Region Sjælland', primaryKommuner:['Holbæk Kommune','Kalundborg Kommune','Odsherred Kommune']},
    {name:'Midt- og Vestsjællands Hospital', url:'https://www.mvhospital.dk', region:'Region Sjælland', primaryKommuner:['Slagelse Kommune','Ringsted Kommune']},
    {name:'Sjællands Universitetshospital – Nykøbing F.', url:'https://www.nfsygehus.dk', region:'Region Sjælland', primaryKommuner:['Guldborgsund Kommune','Lolland Kommune','Vordingborg Kommune']},
    {name:'Psykiatrien Region Sjælland', url:'https://www.mvhospital.dk', region:'Region Sjælland'},
    {name:'Sygehus Lillebælt – Kolding Sygehus', url:'https://www.sygehuslillebaelt.dk/afdelinger/kolding-sygehus', region:'Region Syddanmark'},
    {name:'Sygehus Lillebælt – Vejle Sygehus', url:'https://www.sygehuslillebaelt.dk/afdelinger/vejle-sygehus', region:'Region Syddanmark'},
    {name:'OUH – Svendborg Sygehus', url:'https://ouh.dk/til-patienter-og-parorende/odense-universitetshospital/svendborg-sygehus', region:'Region Syddanmark'},
  ];

  const listEl = document.getElementById('links');
  const filterEl = document.getElementById('filter');
  render(listEl, LINKS);
  wireFilter(filterEl, listEl);
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

  <script src="assets/theme.js?v=24"></script>
  <script src="assets/favorites.js?v=14"></script>
<script src="assets/pwa-update.js?v=20"></script>
  <script src="assets/native-navigation.js?v=26"></script>
</body>
</html>
