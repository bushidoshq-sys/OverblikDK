<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OverblikDK – Offentlige</title>
  <link rel="stylesheet" href="assets/styles.css?v=22" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <script>
    (function () {
      const savedTheme = localStorage.getItem('overblikdk-theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
<header class="header">
  <div class="brand container">
    <img class="logo" src="icons/logo.png" alt="">
    <div>
      <h1>OverblikDK</h1>
      <small>Offentlige tjenester</small>
    </div>
  
      <a class="header-icon-btn" href="index.html" aria-label="Forside" title="Forside">🏛️</a>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Skift mellem lys og mørk visning" aria-pressed="false">
        <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
        <span class="theme-toggle__text">Mørk</span>
      </button></div>
  <div class="navline"></div>
</header>

<main class="container">
  <p><a class="back" href="index.html">← Tilbage til forsiden</a></p>

  <div class="toolbar">
    <div class="input" role="search">
      🔎 <input id="filter" type="search" placeholder="Søg i offentlige links…" aria-label="Søg i links">
    </div>
    <span class="badge"><strong id="count">0</strong> links</span>
  </div>
  <div class="category-filter" id="categoryFilter" aria-label="Filtrér offentlige links">
    <button class="category-btn active" data-category="Alle">Alle</button>
    <button class="category-btn" data-category="Borger & ID">Borger & ID</button>
    <button class="category-btn" data-category="Skat & økonomi">Skat & økonomi</button>
    <button class="category-btn" data-category="Arbejde & ydelser">Arbejde & ydelser</button>
    <button class="category-btn" data-category="Sundhed">Sundhed</button>
    <button class="category-btn" data-category="Familie & bolig">Familie & bolig</button>
    <button class="category-btn" data-category="Ret & sikkerhed">Ret & sikkerhed</button>
    <button class="category-btn" data-category="Demokrati & lov">Demokrati & lov</button>
    <button class="category-btn" data-category="Erhverv">Erhverv</button>
    <button class="category-btn" data-category="International">International</button>
  </div>

  <ul id="links" class="link-list" aria-label="Offentlige links"></ul>
</main>

<footer class="container">© <span id="year"></span> OverblikDK · BushidoDK</footer>

<script>
  // Lille, lokal "helper" (inline for at virke som file://)
  function sortDa(arr, key){ return arr.slice().sort((a,b)=> a[key].localeCompare(b[key],'da',{sensitivity:'base'})); }
  function host(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return '' } }
  function render(listEl, data){
    listEl.innerHTML = '';
    const sorted = sortDa(data,'name');
    sorted.forEach(({name,url,category})=>{
      const li = document.createElement('li');
      li.innerHTML = `<a href="${url}" target="_blank" rel="noopener">
        <span>${name}</span><span class="host">${host(url)} · ${category}</span></a>`;
      listEl.appendChild(li);
    });
    document.getElementById('count').textContent = String(sorted.length);
  }
  function wireFilter(inputEl, listEl){
    inputEl.addEventListener('input', ()=>{
      const q = inputEl.value.toLowerCase().trim();
      for(const li of listEl.querySelectorAll('li')){
        li.style.display = li.textContent.toLowerCase().includes(q) ? '' : 'none';
      }
    });
  }

  const LINKS = [

    {name:'MitID',url:'https://www.mitid.dk',category:'Borger & ID'},
    {name:'CPR – Det Centrale Personregister',url:'https://www.cpr.dk',category:'Borger & ID'},
    {name:'e-Boks',url:'https://www.e-boks.dk',category:'Borger & ID'},
    {name:'SKAT',url:'https://skat.dk',category:'Skat & økonomi'},
    {name:'TastSelv Borger',url:'https://skat.dk/borger',category:'Skat & økonomi'},

    {name:'Gældsstyrelsen – Mit gældsoverblik',url:'https://gaeldst.dk',category:'Skat & økonomi'},
    {name:'Jobnet',url:'https://www.jobnet.dk',category:'Arbejde & ydelser'},
    {name:'Udbetaling Danmark – Din Pension',url:'https://www.borger.dk/handlingsside?selfserviceid=31062a8c-0c86-41a8-a223-1caab02880ff',category:'Arbejde & ydelser'},

    {name:'Politi',url:'https://politi.dk',category:'Ret & sikkerhed'},
    {name:'Danmarks Domstole',url:'https://www.domstol.dk',category:'Ret & sikkerhed'},
    {name:'Folketinget',url:'https://www.ft.dk',category:'Demokrati & lov'},

    {name:'Retsinformation',url:'https://www.retsinformation.dk',category:'Demokrati & lov'},
    {name:'Virk.dk',url:'https://www.virk.dk',category:'Erhverv'},
    {name:'Life in Denmark',url:'https://lifeindenmark.borger.dk',category:'International'},

    {name:'Navneændring',url:'https://www.borger.dk/familie-og-boern/navne-og-navneaendring/navneaendring',category:'Borger & ID'},
    {name:'Forskudsopgørelsen',url:'https://skat.dk/borger/forskudsopgoerelse/forskudsopgoerelsen',category:'Skat & økonomi'},
    {name:'Årsopgørelsen',url:'https://skat.dk/borger/aarsopgoerelse/aarsopgoerelsen',category:'Skat & økonomi'},

    {name:'Styrelsen for Patientsikkerhed',url:'https://stps.dk',category:'Sundhed'},
    {name:'Minretssag.dk',url:'https://minretssag.dk',category:'Ret & sikkerhed'},
    {name:'Tinglysning',url:'https://www.tinglysning.dk',category:'Ret & sikkerhed'},
    {name:'Civilstyrelsen',url:'https://civilstyrelsen.dk',category:'Ret & sikkerhed'},
    {name:'Kriminalforsorgen',url:'https://kriminalforsorgen.dk',category:'Ret & sikkerhed'},
    {name:'Ombudsmanden',url:'https://www.ombudsmanden.dk',category:'Demokrati & lov'},
    {name:'Valg',url:'https://www.valg.im.dk',category:'Demokrati & lov'},
    {name:'Start virksomhed',url:'https://virk.dk/myndigheder/stat/ERST/selvbetjening/Start_virksomhed/',category:'Erhverv'},
    {name:'CVR',url:'https://datacvr.virk.dk',category:'Erhverv'},
    {name:'NemRefusion',url:'https://virk.dk/myndigheder/stat/NemRefusion/',category:'Erhverv'},
    {name:'Indberet årsrapport',url:'https://virk.dk',category:'Erhverv'},
    {name:'New to Denmark',url:'https://www.nyidanmark.dk',category:'International'},
    {name:'Workindenmark',url:'https://www.workindenmark.dk',category:'International'},
    {name:'International Citizen Service',url:'https://lifeindenmark.borger.dk/settle-in-denmark/ics-international-citizen-service',category:'International'}
  ];

  const listEl = document.getElementById('links');
  const filterEl = document.getElementById('filter');
  let activeCategory = 'Alle';
  function applyFilters(){
    const q = filterEl.value.toLowerCase().trim();
    render(listEl, LINKS.filter(x => (activeCategory === 'Alle' || x.category === activeCategory) && (x.name+' '+x.category+' '+host(x.url)).toLowerCase().includes(q)));
  }
  filterEl.addEventListener('input', applyFilters);
  document.querySelectorAll('.category-btn').forEach(btn=>btn.addEventListener('click',()=>{
    document.querySelectorAll('.category-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeCategory=btn.dataset.category;
    applyFilters();
  }));
  applyFilters();
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

  <script src="assets/theme.js?v=24"></script>
  <script src="assets/favorites.js?v=14"></script>
<script src="assets/pwa-update.js?v=20"></script>
  <script src="assets/native-navigation.js?v=25"></script>
</body>
</html>
