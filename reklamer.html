<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OverblikDK – Reklamer & ugeaviser</title>
  <link rel="stylesheet" href="assets/styles.css?v=22" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <script>
    (function () {
      const savedTheme = localStorage.getItem('overblikdk-theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
<header class="header">
  <div class="brand container">
    <img class="logo" src="icons/logo.png" alt="">
    <div>
      <h1>OverblikDK</h1>
      <small>Reklamer & ugeaviser</small>
    </div>
    <a class="header-icon-btn" href="/" aria-label="Forside" title="Forside">🏛️</a>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Skift mellem lys og mørk visning" aria-pressed="false">
      <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
      <span class="theme-toggle__text">Mørk</span>
    </button>
  </div>
  <div class="navline"></div>
</header>

<main class="container">
  <p><a class="back" href="index.html">← Tilbage til forsiden</a></p>

  <section class="quick-panel" aria-labelledby="adsTitle">
    <div class="quick-head">
      <div>
        <p class="section-kicker">Post & tilbud</p>
        <h2 id="adsTitle">📬 Reklamer & ugeaviser</h2>
        <p>Genveje til online tilbudsaviser og officielle Nej tak-ordninger.</p>
      </div>
    </div>
  </section>

  <div class="toolbar">
    <div class="input" role="search">🔎
      <input id="filter" type="search" placeholder="Søg i reklamer og ugeaviser…" aria-label="Søg i links">
    </div>
    <span class="badge"><strong id="count">0</strong> links</span>
  </div>

  <div class="category-filter" id="categoryFilter" aria-label="Filtrér reklamer og ugeaviser">
    <button class="category-btn active" data-category="Alle">Alle</button>
    <button class="category-btn" data-category="Tilbudsaviser & tilbud">Tilbudsaviser & tilbud</button>
    <button class="category-btn" data-category="Reklamefravalg & beskyttelse">Reklamefravalg & beskyttelse</button>
  </div>

  <ul id="links" class="link-list" aria-label="Reklamer og ugeaviser"></ul>
</main>

<footer class="container">© <span id="year"></span> OverblikDK · BushidoDK</footer>

<script>
  function sortDa(arr, key){ return arr.slice().sort((a,b)=> a[key].localeCompare(b[key],'da',{sensitivity:'base'})); }
  function host(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return '' } }
  function render(listEl, data){
    listEl.innerHTML = '';
    const sorted = sortDa(data,'name');
    sorted.forEach(({name,url,desc,category})=>{
      const li = document.createElement('li');
      li.innerHTML = `<a href="${url}" target="_blank" rel="noopener">
        <span>${name}<small class="host">${desc || host(url)}</small></span><span class="host">${category} · ${host(url)}</span></a>`;
      listEl.appendChild(li);
    });
    document.getElementById('count').textContent = String(sorted.length);
  }
  function wireFilter(inputEl, listEl){
    inputEl.addEventListener('input', ()=>{
      const q = inputEl.value.toLowerCase().trim();
      for(const li of listEl.querySelectorAll('li')){
        li.style.display = li.textContent.toLowerCase().includes(q) ? '' : 'none';
      }
    });
  }

  const LINKS = [
    {name:'eTilbudsavis', url:'https://etilbudsavis.dk/', desc:'Online tilbudsaviser og tilbud samlet ét sted', category:'Tilbudsaviser & tilbud'},
    {name:'MineTilbud', url:'https://minetilbud.dk/', desc:'Aktuelle og kommende tilbudsaviser, kataloger og tilbud', category:'Tilbudsaviser & tilbud'},
    {name:'Reklamer NejTak – FK Distribution', url:'https://fk.dk/privat/reklamer-nej-tak/', desc:'Tilmeld, ændr eller afmeld NejTak-ordningen', category:'Reklamefravalg & beskyttelse'},
    {name:'Robinsonlisten – Borger.dk', url:'https://www.borger.dk/bolig-og-flytning/robinsonlisten-markedsfoeringsbeskyttelse', desc:'Beskyttelse mod direkte adresseret markedsføring', category:'Reklamefravalg & beskyttelse'},
    {name:'Nej tak – Forbrugerombudsmanden', url:'https://forbrugerombudsmanden.dk/alle-emner/uanmodede-henvendelser/nej-tak', desc:'Regler og vejledning om NejTak-ordninger og Robinsonlisten', category:'Reklamefravalg & beskyttelse'}
  ];

  const listEl = document.getElementById('links');
  const filterEl = document.getElementById('filter');
  let activeCategory = 'Alle';
  function applyFilters(){
    const q = filterEl.value.toLowerCase().trim();
    render(listEl, LINKS.filter(x => (activeCategory === 'Alle' || x.category === activeCategory) && (x.name+' '+x.desc+' '+x.category+' '+host(x.url)).toLowerCase().includes(q)));
  }
  filterEl.addEventListener('input', applyFilters);
  document.querySelectorAll('.category-btn').forEach(btn=>btn.addEventListener('click',()=>{
    document.querySelectorAll('.category-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeCategory=btn.dataset.category;
    applyFilters();
  }));
  applyFilters();
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

<script src="assets/theme.js?v=24"></script>
<script src="assets/favorites.js?v=14"></script>
<script src="assets/pwa-update.js?v=20"></script>
  <script src="assets/native-navigation.js?v=24"></script>
</body>
</html>
