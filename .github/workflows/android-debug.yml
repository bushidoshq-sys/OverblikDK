name: Build Android APK # signed-v3-retry

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "scripts/**"
      - "native/**"
      - ".github/workflows/android-debug.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Restore permanent signing key
        env:
          OVERBLIKDK_KEYSTORE_BASE64: ${{ secrets.OVERBLIKDK_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$OVERBLIKDK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/overblikdk-release.jks"

      - name: Build signed release APK
        env:
          OVERBLIKDK_RELEASE_KEYSTORE: ${{ runner.temp }}/overblikdk-release.jks
          OVERBLIKDK_KEYSTORE_PASSWORD: ${{ secrets.OVERBLIKDK_KEYSTORE_PASSWORD }}
          OVERBLIKDK_KEY_ALIAS: ${{ secrets.OVERBLIKDK_KEY_ALIAS }}
          OVERBLIKDK_KEY_PASSWORD: ${{ secrets.OVERBLIKDK_KEY_PASSWORD }}
          OVERBLIKDK_VERSION_CODE: ${{ github.run_number }}
          OVERBLIKDK_VERSION_NAME: 1.0.${{ github.run_number }}
        run: npm run android:release

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: OverblikDK-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
