name: Build Android APK # signed-v3-pkcs12

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "scripts/**"
      - "native/**"
      - ".github/workflows/android-debug.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Restore permanent signing key
        env:
          OVERBLIKDK_KEYSTORE_BASE64: ${{ secrets.OVERBLIKDK_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$OVERBLIKDK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/overblikdk-release.jks"

      - name: Verify signing credentials
        env:
          OVERBLIKDK_RELEASE_KEYSTORE: ${{ runner.temp }}/overblikdk-release.jks
          OVERBLIKDK_KEYSTORE_PASSWORD: ${{ secrets.OVERBLIKDK_KEYSTORE_PASSWORD }}
          OVERBLIKDK_KEY_ALIAS: ${{ secrets.OVERBLIKDK_KEY_ALIAS }}
          OVERBLIKDK_KEY_PASSWORD: ${{ secrets.OVERBLIKDK_KEY_PASSWORD }}
        run: |
          set +e
          keytool -list -keystore "$OVERBLIKDK_RELEASE_KEYSTORE" -storepass "$OVERBLIKDK_KEYSTORE_PASSWORD" >/dev/null 2>&1
          STORE_STATUS=$?
          keytool -importkeystore -srckeystore "$OVERBLIKDK_RELEASE_KEYSTORE" -srcstorepass "$OVERBLIKDK_KEYSTORE_PASSWORD" -srcalias "$OVERBLIKDK_KEY_ALIAS" -srckeypass "$OVERBLIKDK_KEY_PASSWORD" -destkeystore "$RUNNER_TEMP/signing-test.p12" -deststoretype PKCS12 -deststorepass "temporary-test-only" -destkeypass "temporary-test-only" -noprompt >/dev/null 2>&1
          KEY_STATUS=$?
          if [ "$STORE_STATUS" -eq 0 ]; then echo "Keystore password: OK"; else echo "Keystore password: FAIL"; fi
          if [ "$KEY_STATUS" -eq 0 ]; then echo "Alias/key password: OK"; else echo "Alias/key password: FAIL"; fi
          if [ "$STORE_STATUS" -ne 0 ] || [ "$KEY_STATUS" -ne 0 ]; then rm -f "$RUNNER_TEMP/signing-test.p12"; exit 1; fi
          mv "$RUNNER_TEMP/signing-test.p12" "$RUNNER_TEMP/overblikdk-release.p12"

      - name: Build signed release APK
        env:
          OVERBLIKDK_RELEASE_KEYSTORE: ${{ runner.temp }}/overblikdk-release.p12
          OVERBLIKDK_KEYSTORE_PASSWORD: temporary-test-only
          OVERBLIKDK_KEY_ALIAS: ${{ secrets.OVERBLIKDK_KEY_ALIAS }}
          OVERBLIKDK_KEY_PASSWORD: temporary-test-only
          OVERBLIKDK_VERSION_CODE: ${{ github.run_number }}
          OVERBLIKDK_VERSION_NAME: 1.0.${{ github.run_number }}
        run: npm run android:release

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: OverblikDK-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
