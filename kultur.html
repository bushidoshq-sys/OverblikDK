  <script>
    (function () {
      const savedTheme = localStorage.getItem('overblikdk-theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

      <small>Kultur</small>
    </div>
  
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Skift mellem lys og mørk visning" aria-pressed="false">

  <div class="navline"></div>
</header>

<main class="container">
  <p><a class="back" href="/">← Tilbage til forsiden</a></p>

  <section class="quick-panel" aria-labelledby="cultureTitle">
    <div class="quick-head"><div>
      <p class="section-kicker">Kultur</p>

      <p>Biblioteker, museer, biografer, teatre, musik, kunst og kulturhuse samlet ét sted.</p>

    <div class="nearby-actions" id="cultureCategories">

      <button class="nearby-btn" type="button" data-culture-category="Teatre">🎭 Teatre</button>
      <button class="nearby-btn" type="button" data-culture-category="Musik & spillesteder">🎵 Musik & spillesteder</button>
      <button class="nearby-btn" type="button" data-culture-category="Kunst & gallerier">🎨 Kunst & gallerier</button>
      <button class="nearby-btn" type="button" data-culture-category="Kulturhuse">🏠 Kulturhuse</button>
      <button class="nearby-btn" type="button" data-culture-category="Andre kultursteder">✨ Andre kultursteder</button>
    </div>
  </section>

  <div id="cultureCategoryView" hidden>
    <p><button class="back culture-back" id="cultureBack" type="button">← Tilbage til Kultur</button></p>
    <div class="toolbar">
      <div class="input" role="search">🔎

      <span class="badge"><strong id="count">0</strong> links</span>
    </div>
    <div id="links" aria-label="Kultur efter kommune"></div>
  </div>
</main>

<script>
  function sortDa(a,k){return a.slice().sort((x,y)=>x[k].localeCompare(y[k],'da',{sensitivity:'base'}))}
  function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch{return''}}
  let activeCategory='';
  function categoryOf(name,explicit=''){if(explicit)return explicit;const s=name.toLowerCase();if(/biograf|cinema/.test(s))return 'Biografer';if(/bibliotek/.test(s))return 'Biblioteker';if(/museum|museet|museer|museums|samling|arkiv|kloster|gården|gaard|fregatten|saltsyderi|kalkminer|slot|slotskirke|historisk/.test(s))return 'Museer';if(/teater|opera|scene|skuespil/.test(s))return 'Teatre';if(/musik|koncert|spillested|maskinhallen/.test(s))return 'Musik & spillesteder';if(/kunst|galleri|glasmuse/.test(s))return 'Kunst & gallerier';if(/kultur|folkets hus|sløjfen|medborger/.test(s))return 'Kulturhuse';return 'Andre kultursteder'}
  function render(el,data){
    el.innerHTML='';
    const municipalities=window.OverblikDKLocalData?.municipalityToRegion || {};
    const groups=new Map(Object.keys(municipalities).map(k=>[k,[]]));
    data.forEach(item=>{if(item.kommune && groups.has(item.kommune)) groups.get(item.kommune).push(item)});
    [...groups.keys()].sort((a,b)=>{
      const helper=window.OverblikDKLocalHelper;
      if(helper?.enabled()){
        const ra=helper.rank({kommune:a,region:municipalities[a]});
        const rb=helper.rank({kommune:b,region:municipalities[b]});
        if(ra!==rb)return ra-rb;
      }
      return a.localeCompare(b,'da',{sensitivity:'base'});
    }).forEach(kommune=>{
      const section=document.createElement('section'); section.className='culture-municipality';
      const h=document.createElement('h2'); h.textContent=kommune.replace('Bornholms Regionskommune','Bornholm').replace(/ Kommune$/,''); section.appendChild(h);
      const items=groups.get(kommune);
      if(items.length){const ul=document.createElement('ul');ul.className='link-list';sortDa(items,'name').forEach(item=>{const li=document.createElement('li');const link=document.createElement('a');link.href=item.url;link.target='_blank';link.rel='noopener';const n=document.createElement('span');n.textContent=item.name;const hs=document.createElement('span');hs.className='host';hs.textContent=host(item.url);link.append(n,hs);li.appendChild(link);ul.appendChild(li)});section.appendChild(ul)}
      else {const p=document.createElement('p');p.className='culture-pending';p.textContent='Kultursteder tilføjes…';section.appendChild(p)}
      el.appendChild(section);
    });
    document.getElementById('count').textContent=data.length;
  }

  const list=document.getElementById('links'), input=document.getElementById('filter');
  const hub=document.querySelector('.quick-panel'), categoryView=document.getElementById('cultureCategoryView');
  function showCategory(category){
    activeCategory=category;
    const data=LINKS.filter(x=>categoryOf(x.name,x.category)===category);
    hub.hidden=true; categoryView.hidden=false;
    render(list,data); input.value='';
  }
  function showHub(){
    activeCategory=''; categoryView.hidden=true; hub.hidden=false; list.innerHTML=''; input.value='';
  }
  document.querySelectorAll('[data-culture-category]').forEach(btn=>btn.addEventListener('click',()=>showCategory(btn.dataset.cultureCategory)));
  document.getElementById('cultureBack').addEventListener('click',showHub);
  showHub(); wireFilter(input,list);
  document.getElementById('year').textContent=new Date().getFullYear();
