<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OverblikDK – Kultur</title>
  <link rel="stylesheet" href="assets/styles.css?v=22" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <script>
    (function () {
      const savedTheme = localStorage.getItem('overblikdk-theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
<header class="header">
  <div class="brand container">
    <img class="logo" src="icons/logo.png" alt="">
    <div>
      <h1>OverblikDK</h1>
      <small>Kunst &amp; kultur</small>
    </div>
  
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Skift mellem lys og mørk visning" aria-pressed="false">
        <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
        <span class="theme-toggle__text">Mørk</span>
      </button></div>
  <div class="navline"></div>
</header>

<main class="container">
  <p><a class="back" href="index.html">← Tilbage til forsiden</a></p>

  <div class="toolbar">
    <div class="input" role="search">🔎
      <input id="filter" type="search" placeholder="Søg i kommune eller kultursted…" aria-label="Søg i links">
    </div>
    <span class="badge"><strong id="count">0</strong> links</span>
  </div>

  <div id="links" aria-label="Kunst og kultur efter kommune"></div>
</main>

<footer class="container">© <span id="year"></span> OverblikDK · BushidoDK</footer>

<script src="assets/local-data.js?v=6"></script>
<script src="assets/local-helper.js?v=27"></script>

<script>
  function sortDa(a,k){return a.slice().sort((x,y)=>x[k].localeCompare(y[k],'da',{sensitivity:'base'}))}
  function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch{return''}}
  function render(el,data){
    el.innerHTML='';
    const municipalities=window.OverblikDKLocalData?.municipalityToRegion || {};
    const groups=new Map(Object.keys(municipalities).map(k=>[k,[]]));
    data.forEach(item=>{if(item.kommune && groups.has(item.kommune)) groups.get(item.kommune).push(item)});
    [...groups.keys()].sort((a,b)=>a.localeCompare(b,'da',{sensitivity:'base'})).forEach(kommune=>{
      const section=document.createElement('section'); section.className='culture-municipality';
      const h=document.createElement('h2'); h.textContent=kommune.replace('Bornholms Regionskommune','Bornholm').replace(/ Kommune$/,''); section.appendChild(h);
      const items=groups.get(kommune);
      if(items.length){const ul=document.createElement('ul');ul.className='link-list';sortDa(items,'name').forEach(item=>{const li=document.createElement('li');const link=document.createElement('a');link.href=item.url;link.target='_blank';link.rel='noopener';const n=document.createElement('span');n.textContent=item.name;const hs=document.createElement('span');hs.className='host';hs.textContent=host(item.url);link.append(n,hs);li.appendChild(link);ul.appendChild(li)});section.appendChild(ul)}
      else {const p=document.createElement('p');p.className='culture-pending';p.textContent='Kultursteder tilføjes…';section.appendChild(p)}
      el.appendChild(section);
    });
    document.getElementById('count').textContent=data.length;
  }
  function wireFilter(inp,root){inp.addEventListener('input',()=>{const q=inp.value.toLowerCase().trim();for(const s of root.querySelectorAll('.culture-municipality'))s.style.display=s.textContent.toLowerCase().includes(q)?'':'none'})}

  const LINKS = [
    {name:'Arbejdermuseet',url:'https://arbejdermuseet.dk',kommune:'Københavns Kommune'},
    {name:'Den Gamle By',url:'https://dengamleby.dk',kommune:'Aarhus Kommune'},
    {name:'Det Kgl. Teater',url:'https://kglteater.dk',kommune:'Københavns Kommune'},
    {name:'Krigsmuseet',url:'https://krigsmuseet.dk',kommune:'Københavns Kommune'},
    {name:'Louisiana Museum of Modern Art',url:'https://louisiana.dk',kommune:'Fredensborg Kommune'},
    {name:'Nationalmuseet',url:'https://natmus.dk',kommune:'Københavns Kommune'},
    {name:'Statens Museum for Kunst',url:'https://www.smk.dk',kommune:'Københavns Kommune'},
    {name:'Tivoli København',url:'https://www.tivoli.dk',kommune:'Københavns Kommune'}
  ];

  const list=document.getElementById('links'), input=document.getElementById('filter');
  render(list,LINKS); wireFilter(input,list);
  document.getElementById('year').textContent=new Date().getFullYear();
</script>

  <script src="assets/theme.js?v=24"></script>
  <script src="assets/favorites.js?v=14"></script>
<script src="assets/pwa-update.js?v=41"></script>
  <script src="assets/native-navigation.js?v=24"></script>
</body>
</html>
