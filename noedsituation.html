<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OverblikDK – Nødsituation</title>
  <link rel="stylesheet" href="assets/styles.css?v=62" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <script>
    (function () {
      const savedTheme = localStorage.getItem('overblikdk-theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ed1c24" />
  <meta name="description" content="OverblikDK – samlet nødhjælp, position og nødkontakter." />
</head>
<body>
  <header class="header">
    <div class="brand container">
      <img class="logo" src="icons/logo.png" alt="">
      <div>
        <h1>OverblikDK</h1>
        <small>Nødsituation</small>
      </div>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Skift mellem lys og mørk visning" aria-pressed="false">
        <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
        <span class="theme-toggle__text">Mørk</span>
      </button>
      <a class="header-icon-btn" href="indstillinger.html" aria-label="Indstillinger" title="Indstillinger">⚙️</a>
    </div>
    <div class="navline"></div>
  </header>

  <main class="container">
    <p><a class="back" href="index.html">← Tilbage</a></p>

    <section class="emergency-panel" aria-labelledby="emergencyTitle">
      <div class="emergency-head emergency-head--sos">
        <h2 id="emergencyTitle">🚨 Nødsituation 🚨</h2>
      </div>

      <div class="emergency-actions">
        <button class="emergency-call danger" type="button" id="call112Btn">Ring 112</button>
        <button class="emergency-call" type="button" id="showPositionBtn">📍 Vis min position</button>
        <button class="emergency-call" type="button" id="sharePositionBtn">Del min position</button>
        <button class="emergency-call" type="button" id="addEmergencyContactBtn">Tilføj nødkontakt</button>
        <button class="emergency-call" type="button" id="sendOkayBtn">👍 Jeg er okay</button>
        <button class="emergency-call" type="button" id="sosTorchBtn" aria-pressed="false">🔦 Start S.O.S.-blink</button>
      </div>

      <div id="positionBox" class="position-box" hidden></div>
    </section>

    <section class="emergency-panel" aria-labelledby="contactsTitle">
      <div class="emergency-head emergency-head--contacts">
        <div>
          <h2 id="contactsTitle">👥 Nødkontakter</h2>
          <p>Gem op til 3 personer. Du kan ringe, sende SMS, sende position, redigere eller slette dem.</p>
        </div>
        <span class="privacy-pill">Maks. 3</span>
      </div>
      <div id="emergencyContacts" class="emergency-contacts" aria-live="polite"></div>
    </section>
  </main>

  <footer class="container">
    © <span id="year"></span> OverblikDK · BushidoDK
  </footer>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script src="assets/theme.js?v=24"></script>
  <script src="assets/address-provider.js?v=29"></script>
<script src="assets/location-tools.js?v=38"></script>
  <script src="assets/emergency.js?v=56"></script>
  <script src="assets/favorites.js?v=14"></script>
<script src="assets/pwa-update.js?v=38"></script>
  <script src="assets/native-navigation.js?v=27"></script>
</body>
</html>
